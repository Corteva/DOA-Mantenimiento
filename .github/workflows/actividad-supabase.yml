
name: Actividad diaria Supabase

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  registrar-actividad:
    runs-on: ubuntu-latest

    steps:
      - name: Registrar actividad en Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body -X POST \
            "$SUPABASE_URL/rest/v1/actividad_plataforma" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"fecha\":\"$(date -u +%Y-%m-%d)\",\"tipo_actividad\":\"GitHub Actions diario\",\"nuevos_cumplimientos\":0}"
